<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lottie Maker</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1a1a1a;--mute:#6b6b6b;--line:#e2e0da;--acc:#ff5e00;--accink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--ink:#f1f1f1;--mute:#9a9a9a;--line:#333;--acc:#ff5e00;--accink:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px 12px;text-align:center;cursor:pointer;color:var(--mute)}
.drop.on{border-color:var(--acc);color:var(--ink)}
.drop strong{display:block;color:var(--ink);margin-bottom:2px}
.drop input{display:none}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px}
label.f{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
input[type=number]{width:96px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--acc);color:var(--accink);font-weight:600}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
progress{width:100%;height:10px;margin-top:12px}
#log{color:var(--mute);font-size:13px;margin-top:8px;white-space:pre-wrap}
#stage{background:#000;border-radius:10px;overflow:hidden;max-width:100%;margin:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
h2{font-size:16px;margin:0 0 10px}
</style>
</head>
<body>
<main>
<h1>Lottie Maker</h1>
<p class="sub">Background video + SVG overlay in, Lottie <code>.json</code> and <code>.lottie</code> out. Everything runs in your browser; nothing is uploaded.</p>

<div class="card grid">
  <label class="drop" id="dv"><input type="file" id="video" accept="video/*"><strong>Background video</strong><span id="vn">Drop or click (mp4)</span></label>
  <label class="drop" id="ds"><input type="file" id="svg" accept=".svg,image/svg+xml"><strong>SVG overlay</strong><span id="sn">Drop or click (.svg)</span></label>
</div>

<div class="card">
  <h2>Settings</h2>
  <div class="row">
    <label class="f">FPS<input type="number" id="fps" value="24" min="1" max="60"></label>
    <label class="f">Frame quality (1-100)<input type="number" id="q" value="72" min="10" max="100"></label>
    <label class="f">Frame resolution (x of canvas)<input type="number" id="res" value="2" min="1" max="4" step="0.5"></label>
    <label class="f">Max seconds (0 = all)<input type="number" id="maxs" value="0" min="0"></label>
    <label class="f">File name<input type="text" id="name" value="lottie" style="width:160px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit"></label>
  </div>
  <p style="color:var(--mute);font-size:13px;margin:12px 0 0">Canvas size comes from the SVG (<code>viewBox</code>). The video is scaled to cover it. Text and shapes stay still for the whole video.</p>
</div>

<div class="card">
  <button id="go" disabled>Generate</button>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="log"></div>
</div>

<div class="card" id="out" hidden>
  <h2>Preview</h2>
  <div id="stage"></div>
  <div class="actions">
    <button id="dj" class="alt">Download .json</button>
    <button id="dl">Download .lottie</button>
  </div>
</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
// ---- core (no DOM use: unit-testable) ----
/*CORE-START*/
function parsePath(d){
  const toks=d.match(/[MmLlHhVvCcSsQqZz]|-?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/g)||[];
  let i=0,cmd=null,x=0,y=0,sx=0,sy=0,pc=null,pq=null,cur=null;const subs=[],warn=[];
  const num=()=>parseFloat(toks[i++]);
  const add=(p)=>{cur.v.push(p);cur.i.push([0,0]);cur.o.push([0,0])};
  while(i<toks.length){
    if(/[A-Za-z]/.test(toks[i])){cmd=toks[i++];}
    const rel=cmd===cmd.toLowerCase(),C=cmd.toUpperCase();
    if(C==='Z'){if(cur){cur.c=true;x=sx;y=sy}pc=pq=null;continue}
    if(C==='M'){let a=num(),b=num();if(rel){a+=x;b+=y}x=sx=a;y=sy=b;cur={v:[[x,y]],i:[[0,0]],o:[[0,0]],c:false};subs.push(cur);cmd=rel?'l':'L';pc=pq=null}
    else if(C==='L'){let a=num(),b=num();if(rel){a+=x;b+=y}x=a;y=b;add([x,y]);pc=pq=null}
    else if(C==='H'){let a=num();x=rel?x+a:a;add([x,y]);pc=pq=null}
    else if(C==='V'){let a=num();y=rel?y+a:a;add([x,y]);pc=pq=null}
    else if(C==='C'||C==='S'){
      let x1,y1;
      if(C==='C'){x1=num();y1=num();if(rel){x1+=x;y1+=y}}
      else{x1=pc?2*x-pc[0]:x;y1=pc?2*y-pc[1]:y}
      let x2=num(),y2=num(),x3=num(),y3=num();
      if(rel){x2+=x;y2+=y;x3+=x;y3+=y}
      cur.o[cur.o.length-1]=[x1-x,y1-y];cur.v.push([x3,y3]);cur.i.push([x2-x3,y2-y3]);cur.o.push([0,0]);
      pc=[x2,y2];pq=null;x=x3;y=y3;
    }else if(C==='Q'){
      let qx=num(),qy=num(),x3=num(),y3=num();if(rel){qx+=x;qy+=y;x3+=x;y3+=y}
      cur.o[cur.o.length-1]=[2/3*(qx-x),2/3*(qy-y)];cur.v.push([x3,y3]);cur.i.push([2/3*(qx-x3),2/3*(qy-y3)]);cur.o.push([0,0]);
      x=x3;y=y3;pc=pq=null;
    }else{warn.push('Unsupported path command '+cmd);break}
  }
  for(const s of subs){const v=s.v;if(s.c&&v.length>1&&v[0][0]===v[v.length-1][0]&&v[0][1]===v[v.length-1][1]){s.i[0]=s.i[s.i.length-1];v.pop();s.i.pop();s.o.pop()}}
  return {subs,warn};
}
function hexRgb(h){
  h=(h||'#000000').trim().toLowerCase();
  const names={white:'#ffffff',black:'#000000',red:'#ff0000',green:'#008000',blue:'#0000ff',yellow:'#ffff00',orange:'#ffa500'};
  if(names[h])h=names[h];
  if(/^#[0-9a-f]{3}$/.test(h))h='#'+[...h.slice(1)].map(c=>c+c).join('');
  const m=/^#([0-9a-f]{6})/.exec(h);
  if(m){const n=parseInt(m[1],16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255,1]}
  const r=/^rgb\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(h);
  if(r)return [r[1]/255,r[2]/255,r[3]/255,1];
  return null;
}
const TR=()=>({ty:'tr',p:{a:0,k:[0,0]},a:{a:0,k:[0,0]},s:{a:0,k:[100,100]},r:{a:0,k:0},o:{a:0,k:100}});
function svgToLottieShapes(text){
  const warnings=[];const vb=/viewBox="([^"]+)"/.exec(text);
  let w=0,h=0;
  if(vb){const p=vb[1].trim().split(/[\s,]+/).map(Number);w=p[2];h=p[3]}
  else{w=parseFloat((/\swidth="([\d.]+)/.exec(text)||[])[1])||360;h=parseFloat((/\sheight="([\d.]+)/.exec(text)||[])[1])||180}
  const groups=[];
  const re=/<(path|rect|circle|ellipse)\b([^>]*?)\/?>/g;let m;
  while((m=re.exec(text))){
    const a={};(m[2].match(/[\w-]+="[^"]*"/g)||[]).forEach(s=>{const k=s.indexOf('=');a[s.slice(0,k)]=s.slice(k+2,-1)});
    if(a.transform)warnings.push('A '+m[1]+' has a transform attribute (ignored).');
    if(a.fill==='none')continue;
    const rgb=hexRgb(a.fill==null?'#000000':a.fill);
    if(!rgb){warnings.push('Unsupported fill "'+a.fill+'" (gradients/urls not supported); skipped one '+m[1]+'.');continue}
    let items=[];
    if(m[1]==='path'){const r=parsePath(a.d||'');warnings.push(...r.warn);items=r.subs.map(s=>({ty:'sh',ks:{a:0,k:{c:s.c,v:s.v,i:s.i,o:s.o}}}))}
    else if(m[1]==='rect'){const x=+a.x||0,y=+a.y||0,rw=+a.width,rh=+a.height;items=[{ty:'rc',d:1,s:{a:0,k:[rw,rh]},p:{a:0,k:[x+rw/2,y+rh/2]},r:{a:0,k:+a.rx||0}}]}
    else{const cx=+a.cx||0,cy=+a.cy||0,rx=+(a.r||a.rx),ry=+(a.r||a.ry);items=[{ty:'el',d:1,s:{a:0,k:[rx*2,ry*2]},p:{a:0,k:[cx,cy]}}]}
    groups.push({ty:'gr',nm:m[1],it:[...items,{ty:'fl',c:{a:0,k:rgb},o:{a:0,k:100},r:a['fill-rule']==='evenodd'?2:1,nm:'Fill'},TR()]});
  }
  groups.reverse(); // first = top in Lottie
  return {w,h,groups,warnings};
}
function buildLottie({w,h,groups,frames,fps,name,embed,imgW,imgH}){
  const N=frames.length;
  const overlay={ddd:0,ind:1,ty:4,nm:'Overlay',sr:1,ks:{o:{a:0,k:100},r:{a:0,k:0},p:{a:0,k:[0,0,0]},a:{a:0,k:[0,0,0]},s:{a:0,k:[100,100,100]}},ao:0,shapes:groups,ip:0,op:N,st:0,bm:0};
  const assets=[],layers=[overlay];
  frames.forEach((f,n)=>{
    const a={id:'f'+n,w:imgW,h:imgH};
    if(embed)Object.assign(a,{u:'',p:f.dataUrl,e:1});else Object.assign(a,{u:'/images/',p:f.file,e:0});
    assets.push(a);
    layers.push({ddd:0,ind:2+n,ty:2,nm:'frame_'+n,refId:'f'+n,sr:1,ks:{o:{a:0,k:100},r:{a:0,k:0},p:{a:0,k:[w/2,h/2,0]},a:{a:0,k:[imgW/2,imgH/2,0]},s:{a:0,k:[w/imgW*100,h/imgH*100,100]}},ao:0,ip:n,op:n+1,st:0,bm:0});
  });
  return {v:'5.7.0',fr:fps,ip:0,op:N,w,h,nm:name,ddd:0,assets,layers,markers:[]};
}
/*CORE-END*/

// ---- UI ----
const $=id=>document.getElementById(id);
let vfile=null,sfile=null,result=null;
function wire(drop,input,label,setter){
  input.addEventListener('change',()=>take(input.files[0]));
  ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('on')}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('on')}));
  drop.addEventListener('drop',ev=>take(ev.dataTransfer.files[0]));
  function take(f){if(!f)return;setter(f);label.textContent=f.name;drop.classList.add('on');
    if(!$('name').dataset.touched&&f.name){$('name').value=f.name.replace(/\.[^.]+$/,'')}
    $('go').disabled=!(vfile&&sfile)}
}
$('name').addEventListener('input',()=>$('name').dataset.touched=1);
wire($('dv'),$('video'),$('vn'),f=>vfile=f);
wire($('ds'),$('svg'),$('sn'),f=>sfile=f);
const log=t=>$('log').textContent=t;
const once=(el,ev)=>new Promise((res,rej)=>{el.addEventListener(ev,res,{once:true});el.addEventListener('error',()=>rej(new Error('Video error')),{once:true})});
const toDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});

async function extract(file,W,H,fps,q,maxs,onp){
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);
  await once(v,'loadeddata');
  const dur=maxs>0?Math.min(maxs,v.duration):v.duration,n=Math.max(1,Math.round(dur*fps));
  const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
  const sc=Math.max(W/v.videoWidth,H/v.videoHeight),dw=v.videoWidth*sc,dh=v.videoHeight*sc;
  const out=[];
  for(let i=0;i<n;i++){
    v.currentTime=Math.min(i/fps+0.0005,Math.max(0,v.duration-0.001));
    await once(v,'seeked');
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);
    const blob=await new Promise(r=>c.toBlob(r,'image/webp',q/100));
    const ext=blob.type==='image/webp'?'webp':'png';
    out.push({blob,ext,file:'e_'+String(i+1).padStart(3,'0')+'.'+ext,dataUrl:await toDataURL(blob)});
    onp((i+1)/n);
  }
  URL.revokeObjectURL(v.src);return out;
}
$('go').addEventListener('click',async()=>{
  $('go').disabled=true;$('bar').hidden=false;$('bar').value=0;$('out').hidden=true;
  try{
    const fps=+$('fps').value||24,q=+$('q').value||72,res=+$('res').value||2,maxs=+$('maxs').value||0,name=$('name').value.trim()||'lottie';
    log('Reading SVG...');
    const s=svgToLottieShapes(await sfile.text());
    if(!s.groups.length)throw new Error('No usable shapes found in the SVG.');
    const imgW=Math.round(s.w*res),imgH=Math.round(s.h*res);
    log('Extracting frames...');
    const frames=await extract(vfile,imgW,imgH,fps,q,maxs,p=>{$('bar').value=p;log('Extracting frames... '+Math.round(p*100)+'%')});
    log('Packing...');
    const common={w:s.w,h:s.h,groups:s.groups,frames,fps,name,imgW,imgH};
    const jsonStr=JSON.stringify(buildLottie({...common,embed:true}));
    const zip=new JSZip();
    zip.file('manifest.json',JSON.stringify({version:'1.0',generator:'Lottie Maker',author:'Lottie Maker',animations:[{id:'animation',speed:1,loop:true,autoplay:true}]}));
    zip.file('animations/animation.json',JSON.stringify(buildLottie({...common,embed:false})));
    frames.forEach(f=>zip.file('images/'+f.file,f.blob));
    const lottieBlob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    result={name,json:new Blob([jsonStr],{type:'application/json'}),lottie:lottieBlob};
    $('stage').innerHTML='';$('stage').style.width=Math.min(s.w*2,720)+'px';
    lottie.loadAnimation({container:$('stage'),renderer:'canvas',loop:true,autoplay:true,animationData:JSON.parse(jsonStr)});
    $('out').hidden=false;
    log(frames.length+' frames, '+s.w+'x'+s.h+' @ '+fps+' fps. JSON '+(result.json.size/1e6).toFixed(1)+' MB, .lottie '+(result.lottie.size/1e6).toFixed(1)+' MB.'+(s.warnings.length?'\nWarnings:\n- '+[...new Set(s.warnings)].join('\n- '):''));
  }catch(e){log('Error: '+e.message)}
  $('bar').hidden=true;$('go').disabled=false;
});
function save(blob,fn){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
$('dj').onclick=()=>save(result.json,result.name+'.json');
$('dl').onclick=()=>save(result.lottie,result.name+'.lottie');
</script>
</body>
</html>
